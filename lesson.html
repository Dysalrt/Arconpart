<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arcon — Урок</title>
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

  <!-- ЭКРАН: Урок (теория и задания идут вперемешку, один общий экран) -->
  <div id="screen-lesson" class="screen">
    <header class="lesson-header">
      <button class="icon-btn" id="lesson-exit">←</button>
      <div class="lesson-progress-bar"><div id="lesson-progress-fill" class="progress-fill"></div></div>
      <div id="lesson-hearts" class="hidden">❤️❤️❤️</div>
    </header>
    <div id="lesson-content" class="theory-content"><!-- рендерится из JS: теория ИЛИ задание --></div>
    <div id="lesson-feedback" class="exercise-feedback hidden"></div>
    <button id="lesson-action-btn" class="btn-primary">Продолжить</button>
  </div>

  <!-- ЭКРАН: Итог урока -->
  <div id="screen-complete" class="screen hidden">
    <div class="complete-box">
      <div class="complete-emoji">🎉</div>
      <h2>Урок пройден!</h2>
      <p id="complete-stats"></p>
      <button id="complete-continue" class="btn-primary">Отлично</button>
    </div>
  </div>

<script type="module" src="js/lesson.js"></script>
</body>
</html>
