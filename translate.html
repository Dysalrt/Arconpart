<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arcon — Переводчик</title>
<link rel="stylesheet" href="css/style.css?v=1">
<style>
  .t-wrap { padding: 16px; max-width: 640px; margin: 0 auto; }
  .t-back { display: inline-block; margin-bottom: 14px; color: var(--accent); font-size: 14px; text-decoration: none; }
  .t-textarea {
    width: 100%; min-height: 110px; padding: 12px 14px; border: 1px solid var(--border, #e3e1ec);
    border-radius: 14px; font-size: 15px; font-family: inherit; resize: vertical;
  }
  .t-result-block { margin-top: 16px; }
  .t-result-label { font-size: 12px; color: var(--tg-hint, #8e8e93); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 6px; }
  .t-result-box {
    background: var(--tg-secondary-bg, #f2f2f7); border-radius: 14px; padding: 14px;
    font-size: 15px; white-space: pre-wrap; min-height: 24px;
  }
  .t-result-box.arcon { font-weight: 600; }
  .t-missing { margin-top: 8px; font-size: 13px; color: var(--hint, #75758a); }
  .t-missing b { color: var(--error, #e5484d); }
  .t-note {
    font-size: 12px; color: var(--tg-hint, #8e8e93); margin-top: 18px; line-height: 1.4;
    border-top: 1px solid var(--border, #e3e1ec); padding-top: 12px;
  }
</style>
</head>
<body>
<div class="t-wrap">
  <a class="t-back" href="index.html">← На главную</a>
  <h1 style="font-size:20px;margin:0 0 4px;">Переводчик Arcon 🥚</h1>
  <p style="color:var(--tg-hint,#8e8e93);font-size:13px;margin:0 0 16px;">
    Напиши текст на любом языке — переведём в Arcon (через английский, слово за словом по словарю)
  </p>

  <textarea id="t-input" class="t-textarea" placeholder="Например: привет, как дела?"></textarea>
  <button id="t-translate-btn" class="btn-primary" style="margin-top:10px;">Перевести</button>

  <div class="t-result-block", style="display: none;">
    <div class="t-result-label">Английский (промежуточный шаг)</div>
    <div id="t-english-box" class="t-result-box">—</div>
  </div>

  <div class="t-result-block">
    <div class="t-result-label">Arcon</div>
    <div id="t-arcon-box" class="t-result-box arcon">—</div>
    <div id="t-missing-box" class="t-missing"></div>
  </div>
</div>

<script type="module">
  import { translate } from "./js/translate.js";

  const input = document.getElementById("t-input");
  const btn = document.getElementById("t-translate-btn");
  const englishBox = document.getElementById("t-english-box");
  const arconBox = document.getElementById("t-arcon-box");
  const missingBox = document.getElementById("t-missing-box");

  btn.onclick = async () => {
    const text = input.value.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = "Переводим...";
    missingBox.textContent = "";

    try {
      const result = await translate(text);
      englishBox.textContent = result.english;
      arconBox.textContent = result.arcon;
      if (result.missing.length) {
        missingBox.innerHTML = "Не найдено в словаре: <b>" + result.missing.join(", ") + "</b>";
      }
    } catch (err) {
      englishBox.textContent = "—";
      arconBox.textContent = "Ошибка: " + err.message;
    }

    btn.disabled = false;
    btn.textContent = "Перевести";
  };
</script>
</body>
</html>
